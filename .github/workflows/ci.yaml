name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el código del repositorio en la máquina virtual
      - uses: actions/checkout@v4

      # 2. Cambiamos setup-go por setup-python para instalar Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # Usamos una versión estable de Python 3

      # 3. En Python no se "compila" como en Go, pero necesitamos instalar las dependencias
      # (Flask, pytest, etc.) para que los tests puedan correr.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Pruebas unitarias e integración con pytest
      # En el ecosistema de Python, el comando `pytest` se encarga de buscar y correr todas las pruebas automáticamente.
      - name: Ejecutar pruebas (Pytest)
        run: pytest